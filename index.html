<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Idaho 50501 – Mutual Aid Search</title>
  <style>
    :root { --bg:#0f1b3d; --card:#ffffff; --muted:#6b7280; --line:#e5e7eb; --pill:#f3f4f6; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; background: var(--bg); }
    .wrap { max-width: 980px; margin: 0 auto; padding: 28px 16px 80px; }
    .card { background: var(--card); border-radius: 18px; box-shadow: 0 10px 40px rgba(0,0,0,.18); overflow:hidden; }
    .header { padding: 18px 18px 10px; border-bottom:1px solid var(--line); }
    .title { font-size: 22px; font-weight: 800; margin:0; }
    .sub { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
    .controls { padding: 14px 18px; display:flex; gap:10px; align-items:center; border-bottom:1px solid var(--line); flex-wrap:wrap;}
    input[type="search"]{
      flex: 1 1 420px;
      border:1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 16px;
      outline: none;
    }
    button{
      border:1px solid var(--line);
      background:#fff;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 14px;
      cursor:pointer;
    }
    button:hover{ background:#fafafa; }
    .meta { padding: 10px 18px 0; color: var(--muted); font-size: 13px; display:flex; gap:12px; flex-wrap:wrap;}
    .pill { background: var(--pill); border:1px solid var(--line); padding:6px 10px; border-radius: 999px; }
    .list { padding: 10px 0; }
    .row {
      padding: 12px 18px;
      border-top:1px solid var(--line);
      cursor:pointer;
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:flex-start;
    }
    .row:hover { background:#fafafa; }
    .row:first-child { border-top: none; }
    .r-main { min-width: 0; }
    .r-title { font-weight: 700; margin:0; font-size: 16px; }
    .r-snippet { margin:6px 0 0; color: var(--muted); font-size: 13px; line-height: 1.35; }
    .r-right { flex: 0 0 auto; color: var(--muted); font-size: 12px; display:flex; align-items:center; gap:8px; }
    .tag { border:1px solid var(--line); background: var(--pill); padding:4px 8px; border-radius: 999px; white-space:nowrap; }
    .status { padding: 14px 18px; color: var(--muted); font-size: 14px; }
    .empty { padding: 22px 18px; color: var(--muted); font-size: 14px; }

    /* Modal */
    .modal-backdrop{
      position:fixed; inset:0; background:rgba(0,0,0,.5);
      display:none; align-items:center; justify-content:center; padding:16px;
    }
    .modal {
      width:min(900px, 100%);
      background:#fff; border-radius: 16px; overflow:hidden;
      box-shadow: 0 20px 70px rgba(0,0,0,.35);
    }
    .modal-h {
      padding: 14px 16px; border-bottom:1px solid var(--line);
      display:flex; align-items:center; justify-content:space-between; gap:10px;
    }
    .modal-title { margin:0; font-weight: 800; font-size: 16px; }
    .modal-b { padding: 12px 16px; max-height: 70vh; overflow:auto; }
    .kv { border-top:1px solid var(--line); padding:10px 0; }
    .kv:first-child{ border-top:none; }
    .k { font-size: 12px; color: var(--muted); margin:0 0 4px; }
    .v { margin:0; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
    .links a { display:inline-block; margin: 6px 8px 0 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="header">
        <p class="title">Idaho 50501 — Mutual Aid Search</p>
        <p class="sub">Type keywords (e.g., “Facebook”, “GoFundMe”, “food”, “rent”, “accident”) to find a match.</p>
      </div>

      <div class="controls">
        <input id="q" type="search" placeholder='Search: "facebook", "gofundme", "food assistance", "Meridian"...' autocomplete="off" />
        <button id="clearBtn" type="button">Clear</button>
      </div>

      <div class="meta">
        <span class="pill" id="loadState">Loading…</span>
        <span class="pill" id="countState">0 items</span>
        <span class="pill" id="matchState">0 matches</span>
      </div>

      <div id="content" class="list">
        <div class="status" id="status">Fetching the latest directory data…</div>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-backdrop" id="backdrop" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modal-h">
        <p class="modal-title" id="modalTitle">Details</p>
        <button id="closeBtn" type="button">Close</button>
      </div>
      <div class="modal-b" id="modalBody"></div>
    </div>
  </div>

<script>
  // Your published CSV (cache-busted each load so updates show up)
  const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTRjJ-IVdaW-RCw_YDDbX3nM0iH6weKVWJFw_OX1C24WM9fyPbJYM2NjXGxevIdG6jtx6rpB2xK6tqo/pub?gid=625164440&single=true&output=csv";

  const elQ = document.getElementById("q");
  const elContent = document.getElementById("content");
  const elStatus = document.getElementById("status");
  const elLoadState = document.getElementById("loadState");
  const elCountState = document.getElementById("countState");
  const elMatchState = document.getElementById("matchState");
  const elClearBtn = document.getElementById("clearBtn");

  const backdrop = document.getElementById("backdrop");
  const closeBtn = document.getElementById("closeBtn");
  const modalTitle = document.getElementById("modalTitle");
  const modalBody = document.getElementById("modalBody");

  let rows = [];        // array of objects
  let headers = [];     // header names

  // ----- CSV parsing (handles quoted commas/newlines) -----
  function parseCSV(text) {
    const out = [];
    let row = [];
    let cur = "";
    let i = 0;
    let inQuotes = false;

    while (i < text.length) {
      const c = text[i];

      if (c === '"') {
        if (inQuotes && text[i + 1] === '"') { cur += '"'; i += 2; continue; } // escaped quote
        inQuotes = !inQuotes;
        i++;
        continue;
      }

      if (!inQuotes && (c === ",")) {
        row.push(cur); cur = ""; i++; continue;
      }

      if (!inQuotes && (c === "\n" || c === "\r")) {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(cur); cur = "";
        // skip empty last line
        if (row.length > 1 || row[0].trim() !== "") out.push(row);
        row = [];
        i++;
        continue;
      }

      cur += c;
      i++;
    }
    row.push(cur);
    if (row.length > 1 || row[0].trim() !== "") out.push(row);
    return out;
  }

  function normalize(s) {
    return (s ?? "")
      .toString()
      .toLowerCase()
      .normalize("NFKD")
      .replace(/\p{Diacritic}/gu, "");
  }

  function extractUrls(obj) {
    const urls = [];
    for (const k of Object.keys(obj)) {
      const v = (obj[k] ?? "").toString();
      const matches = v.match(/https?:\/\/[^\s)]+/gi) || [];
      for (const m of matches) urls.push(m);
      // also catch bare www.
      const www = v.match(/\bwww\.[^\s)]+/gi) || [];
      for (const w of www) urls.push("https://" + w);
    }
    // unique
    return [...new Set(urls)];
  }

  function bestTitle(obj) {
    // Prefer common “name/title/organization” columns if present
    const preferred = ["name", "title", "organization", "org", "group", "resource", "contact", "description"];
    for (const p of preferred) {
      const key = headers.find(h => normalize(h) === p);
      if (key && obj[key] && obj[key].trim()) return obj[key].trim();
    }
    // fallback: first non-empty cell
    for (const h of headers) {
      const v = (obj[h] ?? "").toString().trim();
      if (v) return v;
    }
    return "Untitled entry";
  }

  function snippet(obj) {
    // Make a short snippet from remaining fields
    const parts = [];
    for (const h of headers) {
      const v = (obj[h] ?? "").toString().trim();
      if (!v) continue;
      parts.push(v);
      if (parts.join(" • ").length > 160) break;
    }
    const s = parts.join(" • ");
    return s.length > 180 ? s.slice(0, 177) + "…" : s;
  }

  function scoreMatch(obj, q) {
    if (!q) return 0;
    const hay = normalize(headers.map(h => `${h}: ${obj[h] ?? ""}`).join(" | "));
    const terms = normalize(q).split(/\s+/).filter(Boolean);
    let score = 0;
    for (const t of terms) {
      const idx = hay.indexOf(t);
      if (idx >= 0) score += 10;
    }
    // small bonus if any url contains term
    const urls = extractUrls(obj).join(" ");
    const uhay = normalize(urls);
    for (const t of terms) if (uhay.includes(t)) score += 3;
    return score;
  }

  function renderList(q) {
    elContent.innerHTML = "";
    const query = q.trim();

    if (!rows.length) {
      elContent.innerHTML = `<div class="status">No data loaded.</div>`;
      elMatchState.textContent = "0 matches";
      return;
    }

    if (!query) {
      elContent.innerHTML = `<div class="empty">Start typing to search.</div>`;
      elMatchState.textContent = "0 matches";
      postHeight();
      return;
    }

    const scored = rows
      .map(r => ({ r, s: scoreMatch(r, query) }))
      .filter(x => x.s > 0)
      .sort((a,b) => b.s - a.s)
      .slice(0, 60);

    elMatchState.textContent = `${scored.length} matches`;

    if (!scored.length) {
      elContent.innerHTML = `<div class="empty">No matches for “${escapeHtml(query)}”. Try fewer words.</div>`;
      postHeight();
      return;
    }

    for (const { r } of scored) {
      const t = bestTitle(r);
      const sn = snippet(r);
      const urls = extractUrls(r);
      const tag = urls.length ? "Link" : "Details";

      const div = document.createElement("div");
      div.className = "row";
      div.innerHTML = `
        <div class="r-main">
          <p class="r-title">${escapeHtml(t)}</p>
          <p class="r-snippet">${escapeHtml(sn)}</p>
        </div>
        <div class="r-right">
          <span class="tag">${tag}</span>
        </div>
      `;
      div.addEventListener("click", () => {
        if (urls.length) {
          window.open(urls[0], "_blank", "noopener,noreferrer");
        } else {
          openModal(r);
        }
      });
      elContent.appendChild(div);
    }

    postHeight();
  }

  function openModal(obj) {
    modalTitle.textContent = bestTitle(obj);
    const urls = extractUrls(obj);

    const blocks = [];
    if (urls.length) {
      blocks.push(`<div class="kv"><p class="k">Links</p><p class="v links">${
        urls.map(u => `<a href="${escapeAttr(u)}" target="_blank" rel="noopener noreferrer">${escapeHtml(u)}</a>`).join("")
      }</p></div>`);
    }

    for (const h of headers) {
      const v = (obj[h] ?? "").toString().trim();
      if (!v) continue;
      blocks.push(`
        <div class="kv">
          <p class="k">${escapeHtml(h)}</p>
          <p class="v">${escapeHtml(v)}</p>
        </div>
      `);
    }

    modalBody.innerHTML = blocks.join("") || `<div class="kv"><p class="v">No details available.</p></div>`;
    backdrop.style.display = "flex";
  }

  function closeModal() {
    backdrop.style.display = "none";
    modalBody.innerHTML = "";
  }

  function escapeHtml(s) {
    return (s ?? "").toString()
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }
  function escapeAttr(s){ return escapeHtml(s).replaceAll('"', "&quot;"); }

  // --- iframe auto-height helper (optional but nice) ---
  function postHeight() {
    const h = document.documentElement.scrollHeight;
    window.parent?.postMessage({ type: "mutualAidHeight", height: h }, "*");
  }
  window.addEventListener("load", postHeight);

  // Debounce input
  let tmr = null;
  elQ.addEventListener("input", () => {
    clearTimeout(tmr);
    tmr = setTimeout(() => renderList(elQ.value), 120);
  });

  elClearBtn.addEventListener("click", () => {
    elQ.value = "";
    elQ.focus();
    renderList("");
  });

  backdrop.addEventListener("click", (e) => { if (e.target === backdrop) closeModal(); });
  closeBtn.addEventListener("click", closeModal);
  window.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

  async function load() {
    try {
      elLoadState.textContent = "Loading…";
      elStatus.textContent = "Fetching the latest directory data…";

      const res = await fetch(CSV_URL + "&_=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error("Fetch failed: " + res.status);
      const text = await res.text();

      const table = parseCSV(text);
      headers = (table[0] || []).map(h => (h ?? "").toString().trim()).filter(Boolean);
      const data = table.slice(1);

      rows = data
        .filter(r => r.some(cell => (cell ?? "").toString().trim() !== ""))
        .map(r => {
          const obj = {};
          for (let i = 0; i < headers.length; i++) obj[headers[i]] = (r[i] ?? "").toString();
          return obj;
        });

      elLoadState.textContent = "Ready";
      elCountState.textContent = `${rows.length} items`;
      elStatus.remove();

      renderList(elQ.value);
      postHeight();
    } catch (err) {
      elLoadState.textContent = "Error";
      elContent.innerHTML = `<div class="status">Couldn’t load the spreadsheet right now. Please try again later.</div>`;
      console.error(err);
      postHeight();
    }
  }

  load();
</script>
</body>
</html>
