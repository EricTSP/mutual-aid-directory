<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Idaho 50501 – Mutual Aid Search</title>
  <style>
    :root { --bg:#0f1b3d; --card:#ffffff; --muted:#6b7280; --line:#e5e7eb; --pill:#f3f4f6; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; background: var(--bg); }
    .wrap { max-width: 980px; margin: 0 auto; padding: 28px 16px 80px; }
    .card { background: var(--card); border-radius: 18px; box-shadow: 0 10px 40px rgba(0,0,0,.18); overflow:hidden; }
    .header { padding: 18px 18px 10px; border-bottom:1px solid var(--line); }
    .title { font-size: 22px; font-weight: 800; margin:0; }
    .sub { margin: 6px 0 0; color: var(--muted); font-size: 14px; }

    .controls { padding: 14px 18px; display:flex; gap:10px; align-items:center; border-bottom:1px solid var(--line); flex-wrap:wrap;}
    input[type="search"]{
      flex: 1 1 420px;
      border:1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 16px;
      outline: none;
    }
    button{
      border:1px solid var(--line);
      background:#fff;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 14px;
      cursor:pointer;
    }
    button:hover{ background:#fafafa; }

    .meta { padding: 10px 18px 0; color: var(--muted); font-size: 13px; display:flex; gap:12px; flex-wrap:wrap;}
    .pill { background: var(--pill); border:1px solid var(--line); padding:6px 10px; border-radius: 999px; }

    .list { padding: 10px 0; }
    .row {
      padding: 12px 18px;
      border-top:1px solid var(--line);
      cursor:pointer;
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:flex-start;
    }
    .row:hover { background:#fafafa; }
    .row:first-child { border-top: none; }
    .r-main { min-width: 0; }
    .r-title { font-weight: 700; margin:0; font-size: 16px; }
    .r-snippet { margin:6px 0 0; color: var(--muted); font-size: 13px; line-height: 1.35; }
    .r-right { flex: 0 0 auto; color: var(--muted); font-size: 12px; display:flex; align-items:center; gap:8px; }
    .tag { border:1px solid var(--line); background: var(--pill); padding:4px 8px; border-radius: 999px; white-space:nowrap; }

    .status { padding: 14px 18px; color: var(--muted); font-size: 14px; }
    .empty { padding: 22px 18px; color: var(--muted); font-size: 14px; }

    /* Modal */
    .modal-backdrop{
      position:fixed; inset:0; background:rgba(0,0,0,.5);
      display:none; align-items:center; justify-content:center; padding:16px;
    }
    .modal {
      width:min(900px, 100%);
      background:#fff; border-radius: 16px; overflow:hidden;
      box-shadow: 0 20px 70px rgba(0,0,0,.35);
    }
    .modal-h {
      padding: 14px 16px; border-bottom:1px solid var(--line);
      display:flex; align-items:center; justify-content:space-between; gap:10px;
    }
    .modal-title { margin:0; font-weight: 800; font-size: 16px; }
    .modal-actions { display:flex; align-items:center; gap:8px; }
    .modal-b { padding: 12px 16px; max-height: 70vh; overflow:auto; }
    .kv { border-top:1px solid var(--line); padding:10px 0; }
    .kv:first-child{ border-top:none; }
    .k { font-size: 12px; color: var(--muted); margin:0 0 4px; }
    .v { margin:0; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
    .links a { display:inline-block; margin: 6px 8px 0 0; }

    /* Small note under controls */
    .hint { padding: 0 18px 10px; color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="header">
        <p class="title">Idaho 50501 — Mutual Aid Search</p>
        <p class="sub">Type keywords (e.g., “Facebook”, “GoFundMe”, “food”, “rent”, “accident”) to find a match.</p>
      </div>

      <div class="controls">
        <input id="q" type="search" placeholder='Search: "facebook", "gofundme", "food assistance", "Meridian"...' autocomplete="off" />
        <button id="clearBtn" type="button">Clear</button>
        <button id="refreshBtn" type="button" title="Reload latest data">Refresh</button>
      </div>
      <div class="hint">Tip: click any result to open details and links.</div>

      <div class="meta">
        <span class="pill" id="loadState">Loading…</span>
        <span class="pill" id="countState">0 items</span>
        <span class="pill" id="matchState">0 matches</span>
        <span class="pill" id="updatedState">Last updated: —</span>
      </div>

      <div id="content" class="list">
        <div class="status" id="status">Fetching the latest directory data…</div>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-backdrop" id="backdrop" role="dialog" aria-modal="true">
    <div class="modal" role="document">
      <div class="modal-h">
        <p class="modal-title" id="modalTitle">Details</p>
        <div class="modal-actions">
          <button id="openFirstLinkBtn" type="button" style="display:none;">Open first link</button>
          <button id="closeBtn" type="button">Close</button>
        </div>
      </div>
      <div class="modal-b" id="modalBody"></div>
    </div>
  </div>

<script>
  /********************************************************************
   * CONFIG
   ********************************************************************/
  // Published Google Sheet CSV URL (what you already use).
  // IMPORTANT: This must be a published-to-web CSV endpoint (or otherwise publicly readable).
  const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTRjJ-IVdaW-RCw_YDDbX3nM0iH6weKVWJFw_OX1C24WM9fyPbJYM2NjXGxevIdG6jtx6rpB2xK6tqo/pub?gid=625164440&single=true&output=csv";

  // When embedded, only postMessage to these parent origins.
  // Add more if you embed elsewhere.
  const ALLOWED_PARENT_ORIGINS = new Set([
    "https://idaho50501.com"
  ]);

  // Max results shown
  const MAX_RESULTS = 60;

  /********************************************************************
   * DOM
   ********************************************************************/
  const elQ = document.getElementById("q");
  const elContent = document.getElementById("content");
  const elStatus = document.getElementById("status");
  const elLoadState = document.getElementById("loadState");
  const elCountState = document.getElementById("countState");
  const elMatchState = document.getElementById("matchState");
  const elUpdatedState = document.getElementById("updatedState");
  const elClearBtn = document.getElementById("clearBtn");
  const elRefreshBtn = document.getElementById("refreshBtn");

  const backdrop = document.getElementById("backdrop");
  const closeBtn = document.getElementById("closeBtn");
  const openFirstLinkBtn = document.getElementById("openFirstLinkBtn");
  const modalTitle = document.getElementById("modalTitle");
  const modalBody = document.getElementById("modalBody");

  let rows = [];           // array of objects
  let headers = [];        // header names (alignment-safe)
  let lastFetchedAt = null;
  let lastModalUrls = [];

  /********************************************************************
   * CSV PARSER (handles quoted commas/newlines)
   ********************************************************************/
  function parseCSV(text) {
    const out = [];
    let row = [];
    let cur = "";
    let i = 0;
    let inQuotes = false;

    while (i < text.length) {
      const c = text[i];

      if (c === '"') {
        if (inQuotes && text[i + 1] === '"') { cur += '"'; i += 2; continue; } // escaped quote
        inQuotes = !inQuotes;
        i++;
        continue;
      }

      if (!inQuotes && c === ",") {
        row.push(cur); cur = ""; i++; continue;
      }

      if (!inQuotes && (c === "\n" || c === "\r")) {
        if (c === "\r" && text[i + 1] === "\n") i++; // Windows CRLF
        row.push(cur); cur = "";
        if (row.length > 1 || row[0].trim() !== "") out.push(row);
        row = [];
        i++;
        continue;
      }

      cur += c;
      i++;
    }

    row.push(cur);
    if (row.length > 1 || row[0].trim() !== "") out.push(row);
    return out;
  }

  /********************************************************************
   * HELPERS
   ********************************************************************/
  function normalize(s) {
    return (s ?? "")
      .toString()
      .toLowerCase()
      .normalize("NFKD")
      .replace(/\p{Diacritic}/gu, "");
  }

  function escapeHtml(s) {
    return (s ?? "").toString()
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }
  function escapeAttr(s){ return escapeHtml(s).replaceAll('"', "&quot;"); }

  function extractUrls(obj) {
    const urls = [];
    for (const k of Object.keys(obj)) {
      const v = (obj[k] ?? "").toString();
      const matches = v.match(/https?:\/\/[^\s)]+/gi) || [];
      for (const m of matches) urls.push(m.replace(/[.,;:]+$/g, "")); // trim trailing punctuation
      const www = v.match(/\bwww\.[^\s)]+/gi) || [];
      for (const w of www) urls.push(("https://" + w).replace(/[.,;:]+$/g, ""));
    }
    return [...new Set(urls)];
  }

  function bestTitle(obj) {
    const preferred = ["name", "title", "organization", "org", "group", "resource", "contact", "description"];
    for (const p of preferred) {
      const key = headers.find(h => normalize(h) === p);
      if (key && obj[key] && obj[key].trim()) return obj[key].trim();
    }
    for (const h of headers) {
      const v = (obj[h] ?? "").toString().trim();
      if (v) return v;
    }
    return "Untitled entry";
  }

  function snippet(obj) {
    const parts = [];
    for (const h of headers) {
      const v = (obj[h] ?? "").toString().trim();
      if (!v) continue;
      parts.push(v);
      if (parts.join(" • ").length > 160) break;
    }
    const s = parts.join(" • ");
    return s.length > 180 ? s.slice(0, 177) + "…" : s;
  }

  // Score: each term matched anywhere in the flattened row is worth points.
  function scoreMatch(obj, q) {
    if (!q) return 0;
    const terms = normalize(q).split(/\s+/).filter(Boolean);
    if (!terms.length) return 0;

    const hay = normalize(headers.map(h => `${h}: ${obj[h] ?? ""}`).join(" | "));
    let score = 0;

    for (const t of terms) {
      if (!t) continue;
      if (hay.includes(t)) score += 10;
    }

    // small bonus if any URL contains the term
    const uhay = normalize(extractUrls(obj).join(" "));
    for (const t of terms) if (t && uhay.includes(t)) score += 3;

    return score;
  }

  /********************************************************************
   * IFRAME AUTO-HEIGHT (safe)
   ********************************************************************/
  function getParentOrigin() {
    try {
      if (!document.referrer) return null;
      return new URL(document.referrer).origin;
    } catch {
      return null;
    }
  }

  function postHeight() {
    const h = document.documentElement.scrollHeight;
    const parentOrigin = getParentOrigin();
    if (parentOrigin && ALLOWED_PARENT_ORIGINS.has(parentOrigin)) {
      window.parent?.postMessage({ type: "mutualAidHeight", height: h }, parentOrigin);
    }
  }
  window.addEventListener("load", postHeight);

  /********************************************************************
   * UI RENDER
   ********************************************************************/
  function renderList(q) {
    elContent.innerHTML = "";
    const query = (q ?? "").trim();

    if (!rows.length) {
      elContent.innerHTML = `<div class="status">No data loaded.</div>`;
      elMatchState.textContent = "0 matches";
      postHeight();
      return;
    }

    if (!query) {
      elContent.innerHTML = `<div class="empty">Start typing to search.</div>`;
      elMatchState.textContent = "0 matches";
      postHeight();
      return;
    }

    const scored = rows
      .map(r => ({ r, s: scoreMatch(r, query) }))
      .filter(x => x.s > 0)
      .sort((a,b) => b.s - a.s)
      .slice(0, MAX_RESULTS);

    elMatchState.textContent = `${scored.length} matches`;

    if (!scored.length) {
      elContent.innerHTML = `<div class="empty">No matches for “${escapeHtml(query)}”. Try fewer words.</div>`;
      postHeight();
      return;
    }

    for (const { r } of scored) {
      const t = bestTitle(r);
      const sn = snippet(r);
      const urls = extractUrls(r);
      const tag = urls.length ? "Links" : "Details";

      const div = document.createElement("div");
      div.className = "row";
      div.setAttribute("role", "button");
      div.setAttribute("tabindex", "0");
      div.innerHTML = `
        <div class="r-main">
          <p class="r-title">${escapeHtml(t)}</p>
          <p class="r-snippet">${escapeHtml(sn)}</p>
        </div>
        <div class="r-right">
          <span class="tag">${tag}</span>
        </div>
      `;

      const open = () => openModal(r);
      div.addEventListener("click", open);
      div.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); }
      });

      elContent.appendChild(div);
    }

    postHeight();
  }

  function openModal(obj) {
    modalTitle.textContent = bestTitle(obj);
    const urls = extractUrls(obj);
    lastModalUrls = urls;

    openFirstLinkBtn.style.display = urls.length ? "inline-block" : "none";

    const blocks = [];
    if (urls.length) {
      blocks.push(`<div class="kv"><p class="k">Links</p><p class="v links">${
        urls.map(u => `<a href="${escapeAttr(u)}" target="_blank" rel="noopener noreferrer">${escapeHtml(u)}</a>`).join("")
      }</p></div>`);
    }

    for (const h of headers) {
      const v = (obj[h] ?? "").toString().trim();
      if (!v) continue;
      blocks.push(`
        <div class="kv">
          <p class="k">${escapeHtml(h)}</p>
          <p class="v">${escapeHtml(v)}</p>
        </div>
      `);
    }

    modalBody.innerHTML = blocks.join("") || `<div class="kv"><p class="v">No details available.</p></div>`;
    backdrop.style.display = "flex";
    postHeight();
  }

  function closeModal() {
    backdrop.style.display = "none";
    modalBody.innerHTML = "";
    lastModalUrls = [];
    postHeight();
  }

  /********************************************************************
   * EVENTS
   ********************************************************************/
  let tmr = null;
  elQ.addEventListener("input", () => {
    clearTimeout(tmr);
    tmr = setTimeout(() => renderList(elQ.value), 120);
  });

  elClearBtn.addEventListener("click", () => {
    elQ.value = "";
    elQ.focus();
    renderList("");
  });

  elRefreshBtn.addEventListener("click", () => load(true));

  backdrop.addEventListener("click", (e) => { if (e.target === backdrop) closeModal(); });
  closeBtn.addEventListener("click", closeModal);
  openFirstLinkBtn.addEventListener("click", () => {
    if (lastModalUrls.length) window.open(lastModalUrls[0], "_blank", "noopener,noreferrer");
  });
  window.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

  function setUpdatedPill(date) {
    if (!date) { elUpdatedState.textContent = "Last updated: —"; return; }
    const s = date.toLocaleString(undefined, {
      year: "numeric", month: "short", day: "2-digit",
      hour: "2-digit", minute: "2-digit"
    });
    elUpdatedState.textContent = `Last updated: ${s}`;
  }

  /********************************************************************
   * LOAD DATA (IMPORTANT FIX: alignment-safe headers)
   ********************************************************************/
  function buildHeadersAlignmentSafe(headerRow) {
    // Keep column alignment even if some headers are blank,
    // and make duplicates unique so values don't overwrite each other.
    const seen = new Map();
    return (headerRow || []).map((h, idx) => {
      let name = (h ?? "").toString().trim();
      if (!name) name = `Column ${idx + 1}`;

      const key = name.toLowerCase();
      const n = (seen.get(key) ?? 0) + 1;
      seen.set(key, n);
      if (n > 1) name = `${name} (${n})`;

      return name;
    });
  }

  async function load(isManualRefresh=false) {
    try {
      elLoadState.textContent = isManualRefresh ? "Refreshing…" : "Loading…";
      if (elStatus) elStatus.textContent = "Fetching the latest directory data…";

      const cacheBust = (CSV_URL.includes("?") ? "&" : "?") + "_=" + Date.now();
      const res = await fetch(CSV_URL + cacheBust, { cache: "no-store" });
      if (!res.ok) throw new Error("Fetch failed: " + res.status);

      const text = await res.text();
      const table = parseCSV(text);

      const headerRow = table[0] || [];
      headers = buildHeadersAlignmentSafe(headerRow);

      const data = table.slice(1);

      rows = data
        .filter(r => r.some(cell => (cell ?? "").toString().trim() !== ""))
        .map(r => {
          const obj = {};
          for (let i = 0; i < headers.length; i++) {
            obj[headers[i]] = (r[i] ?? "").toString();
          }
          return obj;
        });

      elLoadState.textContent = "Ready";
      elCountState.textContent = `${rows.length} items`;

      // Remove initial status banner once we’re good
      if (elStatus && elStatus.parentNode) elStatus.parentNode.removeChild(elStatus);

      lastFetchedAt = new Date();
      setUpdatedPill(lastFetchedAt);

      renderList(elQ.value);
      postHeight();
    } catch (err) {
      elLoadState.textContent = "Error";
      elContent.innerHTML = `<div class="status">Couldn’t load the spreadsheet right now. Please try again later.</div>`;
      console.error(err);
      postHeight();
    }
  }

  load();
</script>
</body>
</html>
